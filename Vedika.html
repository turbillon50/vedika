<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Védika · Sistema legal triangular</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>

<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0B1733"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Védika"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="vedika.css"/>

<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0B1733; }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #root { position: fixed; inset: 0; }
  .v-stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .v-device {
    width: 390px; height: 844px;
    transform-origin: center center;
    position: relative;
  }
  .v-device.theme-dark  { background: #080A12; }
  .v-device.theme-amber { background: #1A0608; }
  .v-device.theme-light { background: #FBFAF7; }
  .v-fade-in { animation: vFadeIn 320ms ease both; }
  @keyframes vFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* hidden index dot */
  .v-index-dot {
    position: fixed;
    left: calc(14px + env(safe-area-inset-left));
    bottom: calc(14px + env(safe-area-inset-bottom));
    width: 22px; height: 22px; border-radius: 11px;
    background: rgba(212,175,92,0.15);
    border: 1px solid rgba(212,175,92,0.35);
    z-index: 120; cursor: pointer;
    transition: background 160ms ease, transform 160ms ease;
  }
  .v-index-dot:active { transform: scale(0.9); background: rgba(212,175,92,0.35); }
</style>
</head>
<body>
  <div id="root"></div>

  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="vedika-kit.jsx"></script>
  <script type="text/babel" src="screens-01-auth.jsx"></script>
  <script type="text/babel" src="screens-02-citizen.jsx"></script>
  <script type="text/babel" src="screens-03-roles.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const PHONE_W = 390;
    const PHONE_H = 844;

    const SCREENS = [
      { id: "boot",    title: "Splash · Boot",                section: "00 · Marca",          theme: "dark",  Component: ScreenBoot,                    auto: 2600 },
      { id: "auth",    title: "Acceso · Face ID",             section: "00 · Marca",          theme: "light", Component: ScreenAuth,                    auto: 2200 },
      { id: "role",    title: "Selección de rol",             section: "00 · Marca",          theme: "light", Component: ScreenRoleSelect },
      { id: "materia", title: "Onboarding · materia",         section: "01 · Ciudadano",      theme: "light", Component: ScreenMateria },
      { id: "panel",   title: "Panel personal",               section: "01 · Ciudadano",      theme: "light", Component: ScreenPanel },
      { id: "caso",    title: "Detalle del caso",             section: "01 · Ciudadano",      theme: "light", Component: ScreenCaseDetail },
      { id: "boveda",  title: "Bóveda blindada",              section: "01 · Ciudadano",      theme: "light", Component: ScreenBoveda },
      { id: "rojo",    title: "Defensa en ruta · SLA",        section: "02 · Código Rojo",    theme: "amber", Component: ScreenCodigoRojo },
      { id: "esp",     title: "Despacho · agenda triangular", section: "03 · Especialista",   theme: "dark",  Component: ScreenEspecialistaDashboard },
      { id: "notaria", title: "Pipeline notarial",            section: "04 · Entidad",        theme: "light", Component: ScreenEntidadNotaria },
      { id: "root",    title: "Telemetría · balance",         section: "05 · Root",           theme: "dark",  Component: ScreenRoot },
    ];

    const idxFromHash = () => {
      const h = (location.hash || "").replace(/^#/, "").toLowerCase();
      const i = SCREENS.findIndex(s => s.id === h);
      return i >= 0 ? i : 0;
    };

    function useViewportScale() {
      const [scale, setScale] = useState(1);
      useEffect(() => {
        const fit = () => {
          const vv = window.visualViewport;
          const vw = vv ? vv.width  : window.innerWidth;
          const vh = vv ? vv.height : window.innerHeight;
          setScale(Math.min(vw / PHONE_W, vh / PHONE_H));
        };
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
        if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
        return () => {
          window.removeEventListener("resize", fit);
          window.removeEventListener("orientationchange", fit);
          if (window.visualViewport) window.visualViewport.removeEventListener("resize", fit);
        };
      }, []);
      return scale;
    }

    function Menu({ idx, onPick, onClose }) {
      const sections = {};
      SCREENS.forEach((s, i) => { (sections[s.section] = sections[s.section] || []).push({ ...s, idx: i }); });
      return (
        <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(8,10,18,0.86)", backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "min(820px, 100%)", maxHeight: "82vh", overflowY: "auto", background: "#0F1226", border: "1px solid rgba(245,240,225,0.12)", borderRadius: 24, padding: 24, color: "#F5F0E1" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 18 }}>
              <VedikaKnot size={26}/>
              <span className="v-serif" style={{ fontSize: 20, letterSpacing: 4 }}>
                VÉD<span style={{ fontStyle: "italic", color: "#D4AF5C" }}>I</span>KA
              </span>
              <span style={{ fontFamily: "var(--mono)", fontSize: 10, color: "rgba(245,240,225,0.55)", letterSpacing: 1.5 }}>· DEMO INDEX</span>
            </div>
            {Object.keys(sections).map(sec => (
              <div key={sec} style={{ marginBottom: 14 }}>
                <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: 2.5, color: "rgba(245,240,225,0.5)", marginBottom: 8 }}>{sec}</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 8 }}>
                  {sections[sec].map(s => (
                    <button key={s.id} onClick={() => onPick(s.idx)} style={{
                      textAlign: "left", padding: "12px 14px",
                      background: s.idx === idx ? "rgba(212,175,92,0.18)" : "rgba(245,240,225,0.04)",
                      border: s.idx === idx ? "1px solid rgba(212,175,92,0.45)" : "1px solid rgba(245,240,225,0.08)",
                      borderRadius: 12, color: "#F5F0E1", cursor: "pointer",
                      fontFamily: "var(--sans)", fontSize: 13,
                    }}>
                      <div style={{ fontFamily: "var(--mono)", fontSize: 10, color: "rgba(245,240,225,0.55)", letterSpacing: 1.5, marginBottom: 4 }}>
                        {String(s.idx + 1).padStart(2, "0")} · #{s.id}
                      </div>
                      {s.title}
                    </button>
                  ))}
                </div>
              </div>
            ))}
            <button onClick={onClose} style={{ marginTop: 4, padding: "10px 16px", width: "100%", background: "rgba(245,240,225,0.06)", border: "1px solid rgba(245,240,225,0.12)", borderRadius: 10, color: "#F5F0E1", fontFamily: "var(--mono)", fontSize: 11, letterSpacing: 1.5, cursor: "pointer" }}>CERRAR</button>
          </div>
        </div>
      );
    }

    function App() {
      const [idx, setIdx] = useState(idxFromHash);
      const [menuOpen, setMenuOpen] = useState(false);
      const scale = useViewportScale();
      const cur = SCREENS[idx];

      const next = useCallback(() => setIdx(i => (i + 1) % SCREENS.length), []);
      const prev = useCallback(() => setIdx(i => (i - 1 + SCREENS.length) % SCREENS.length), []);

      // Sync hash <-> state
      useEffect(() => {
        const onHash = () => setIdx(idxFromHash());
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      useEffect(() => {
        const want = "#" + SCREENS[idx].id;
        if (location.hash !== want) history.replaceState(null, "", want);
      }, [idx]);

      // Body bg follows screen theme so letterboxing blends in
      useEffect(() => {
        const bg = cur.theme === "dark" ? "#080A12"
                 : cur.theme === "amber" ? "#1A0608"
                 : "#FBFAF7";
        document.documentElement.style.background = bg;
        document.body.style.background = bg;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", bg);
      }, [cur.theme]);

      // Auto-advance for cinematic screens (splash, face id)
      useEffect(() => {
        if (!cur.auto) return;
        const t = setTimeout(() => setIdx(i => (i + 1) % SCREENS.length), cur.auto);
        return () => clearTimeout(t);
      }, [cur.id, cur.auto]);

      // Keyboard (desktop preview)
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
          else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
          else if (e.key === "Escape") setMenuOpen(false);
          else if (e.key === "m" || e.key === "M") setMenuOpen(o => !o);
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [next, prev]);

      // Horizontal swipe for prev/next
      const touch = useRef({ x: 0, y: 0, t: 0 });
      const onTouchStart = (e) => {
        const p = e.changedTouches[0];
        touch.current = { x: p.clientX, y: p.clientY, t: Date.now() };
      };
      const onTouchEnd = (e) => {
        const p = e.changedTouches[0];
        const dx = p.clientX - touch.current.x;
        const dy = p.clientY - touch.current.y;
        const dt = Date.now() - touch.current.t;
        if (dt < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) next(); else prev();
        }
      };

      const Comp = cur.Component;

      return (
        <div>
          <div className="v-stage"
               onClick={next}
               onTouchStart={onTouchStart}
               onTouchEnd={onTouchEnd}>
            <div className={"v-device theme-" + cur.theme + " v-fade-in"}
                 key={cur.id}
                 style={{ transform: "scale(" + scale + ")" }}>
              <Comp/>
            </div>
          </div>

          <div className="v-index-dot"
               onClick={(e) => { e.stopPropagation(); setMenuOpen(true); }}
               title="Índice de pantallas"
               aria-label="Abrir índice de pantallas"/>

          {menuOpen && <Menu idx={idx} onPick={(i) => { setIdx(i); setMenuOpen(false); }} onClose={() => setMenuOpen(false)}/>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
